<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ghvswebtpc</title>
    <link rel="icon" href="../SystemLogo.png">
    <link rel="stylesheet" href="./Style/installpage/install8.css">
    <script>
        document.addEventListener("contextmenu",function(NoCtm){
            NoCtm.preventDefault()
        })
        function btn1_z() {
            let btn1 = document.getElementById("btn1");
            btn1.style.backgroundColor = "rgb(100,0,200)";
            btn1.style.color = "white";
            let btn3 = document.getElementById("btn3");
        }
        function Next(){
            let inputName = document.getElementById("ipt1").value.trim();
            localStorage.setItem("User", inputName);
            location.href = "Install9.html";
        }
        document.addEventListener("keydown",function(keyd){
            if (keyd.key === "Enter"){
                keyd.preventDefault()
                Next()
            }
        })
    </script>
</head>
<body>
    <div id="div_id1">
        <h1 id="text1">设置Ghvswebtpc</h1>
        <p id="text2">Ghvswebtpc</p>
        <h2 id="text3">请输入您的用户名</h2>
        <input id="ipt1" maxlength="15">
        <button id="btn1" onclick="Next()">下一步</button>
        <button id="btn2" onclick="window.location.href='Install7.html'">返回</button>
        <button id="btn3" onclick="window.location.href='Install1.html';localStorage.removeItem('User');">重新安装</button>
    </div>
</body>
</html>
