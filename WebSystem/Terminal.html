<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ghvswebtpc</title>
    <link rel="icon" href="../SystemLogo.png">
    <style>
        body{
            background-color: rgb(0, 0, 0);
            -moz-user-select: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #textarea1{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 100vw;
            height: 100vh;
            font-size: 25px;
            font-family: "Microsoft YaHei", monospace;
            resize: none;
            color: rgb(255,255,255);
            background-color: rgb(0, 0, 0);
            outline: none;
            border: none;
        }
    </style>
    <script>
        document.addEventListener("contextmenu",function(NoCtm){
            NoCtm.preventDefault()
        })
    </script>
</head>
<body>
    <textarea id="textarea1" maxlength="70"></textarea>
    <script>
        let body = document.body;
        let textarea1 = document.getElementById("textarea1");
        textarea1.value = "G:/Ghvswebtpc/SystemSoftFile>";
        document.addEventListener("keydown",(keyd) => {
            if (keyd.key == "Enter") {
                let AllText = textarea1.value;
                let TextArea1Value = AllText.split(">")[1]?.trim() || "";
                if (TextArea1Value === "terminal color:white") {
                    keyd.preventDefault();
                    body.style.backgroundColor = "white";
                    textarea1.style.backgroundColor = "white";
                    textarea1.style.color = "black";
                    textarea1.value = "G:/Ghvswebtpc/SystemSoftFile>"
                }
                else if (TextArea1Value === "terminal color:black") {
                    keyd.preventDefault();
                    body.style.backgroundColor = "black";
                    textarea1.style.backgroundColor = "black";
                    textarea1.style.color = "white";
                    textarea1.value = "G:/Ghvswebtpc/SystemSoftFile>"
                }
                else if (TextArea1Value === "clear terminal") {
                    textarea1.value = "G:/Ghvswebtpc/SystemSoftFile>"
                    keyd.preventDefault();
                }
                else if (TextArea1Value === "hello ghvswebtpc") {
                    textarea1.value = `${textarea1.value}\nHello!欢迎来到Ghvswebtpc，这是一个开源的网页版系统项目!\n开源地址:github.com/T-PageCode/Ghvswebtpc`;
                    setTimeout(() => {
                        textarea1.value = "G:/Ghvswebtpc/SystemSoftFile>";
                    },5000)
                }
                else if (TextArea1Value === "help") {
                    textarea1.value = `${textarea1.value}
                    \n帮助\n
terminal color:white = 切换白色主题\n
terminal color:black = 切换黑色主题\n
clear terminal = 清除输出区\n
hello ghvswebtpc = 介绍Ghvswebtpc，带互动❤\n
help = 帮助\n
注意:字符数>70会停止输入`
                    setTimeout(() => {
                        textarea1.value = "";
                    },10000)
                }
            }
        })
    </script>
</body>
</html>
