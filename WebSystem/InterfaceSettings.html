<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ghvswebtpc</title>
    <link rel="icon" href="../SystemLogo.png">
    <style>
        body{
            background-color: rgb(240, 218, 255);
            background-attachment: fixed;
            -moz-user-select: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
        }
        #text1{
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 40px;
            font-weight: 200;
            color: rgb(0, 0, 0);
        }
        .text2{
            position: fixed;
            margin-left: 30%;
            transform: translateX(-50%);
            font-size: 25px;
            font-weight: 200;
        }
        #OnOffBtn1{
            top: 15%;
        }
        #OnOffBtn2{
            top: 15%;
        }
        .OnOffBtn{
            position: relative;
            left: 90%;
            transform: translate(-50%,-35%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #div_id2{
            margin-top: 25%;
        }
        #div_id3{
            margin-top: 40%; 
        }
        .divClass1{
            position: fixed;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 100%;
            height: 60px;
            border-radius: 10px;
            background-color: white;
            display: flex;
            align-items: center;
        }
        .LabelClass1{
            position: relative;
            width: 52px;
            height: 26px;
        }
        .LabelClass1 input{
            opacity: 0;
            width: 0;
            height: 0;
        }
        .spanClass1{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            border-radius: 26px;
            transition: 0.3s ease;
        }
        .spanClass1::before{
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: rgb(255, 255, 255);
            border-radius: 50%;
            transition: 0.3s;
        }
        .input1:checked + .spanClass1{
            background:rgb(153,0,255);
        }
        .input1:checked + .spanClass1:before{
            transform:translateX(26px);
        }
    </style>
    <script>
        document.addEventListener("contextmenu",function(NoCtm){
            NoCtm.preventDefault()
        })
    </script>
</head>
<body>
    <h1 id="text1">界面</h1>
    <div class="divClass1" id="div_id2">
        <h1 class="text2">显示任务栏白色色块</h1>
        <div class="OnOffBtn" id="OnOffBtn1">
            <label class="LabelClass1">
                <input type="checkbox" class="input1" id="input1">
                <span class="spanClass1"></span>
            </label>
        </div>
    </div>
    <div class="divClass1" id="div_id3">
        <h1 class="text2">窗口使用圆角</h1>
        <div class="OnOffBtn" id="OnOffBtn2">
            <label class="LabelClass1">
                <input type="checkbox" class="input1" id="input2">
                <span class="spanClass1"></span>
            </label>
        </div>
    </div>
    <script>
        let input1 = document.getElementById("input1");
        let input2 = document.getElementById("input2");
        let LS1 = localStorage.getItem("ShowDBLWhiteDiv");
        let LS2 = localStorage.getItem("WindowBorderRadius");
        input1.checked = LS1 === "True";
        input2.checked = LS2 !== "False";
        input1.onchange = function () {
            ocalStorage.setItem("ShowDBLWhiteDiv", input1.checked ? "True" : "False");
            setTimeout(() => {
                top.location.href = "./QHLoad.html";
            },200)
        }
        input2.onchange = function () {
            localStorage.setItem("WindowBorderRadius", input2.checked ? "True" : "False");
            setTimeout(() => {
                top.location.href = "./QHLoad.html";
            },200)
        }
    </script>
</body>
</html>
